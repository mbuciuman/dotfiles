# Set zsh as default shell
set-option -g default-shell /usr/bin/zsh

# Use 256 colors
set-option -g default-terminal "tmux-256color"

# Mouse support
set -g mouse on

# Vi-style copy mode
setw -g mode-keys vi
set-option -g status-keys vi

# Allow copying to Windows clipboard in copy-mode (WSL-specific)
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# Reload config: Ctrl-a r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Escape time
set -sg escape-time 10


# --- GNU Screen-style keybindings ---
# Set prefix key to Ctrl-a (like GNU Screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix  # Send Ctrl-a to applications

# Window navigation with numbers (like screen)
bind 0 select-window -t 0
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Create new window: Ctrl-a c
bind c new-window
bind C-c new-window

# Rename window: Ctrl-a A
bind A command-prompt "rename-window %%"

# Next/previous window: Ctrl-a n/p
bind n next-window
bind C-n next-window
bind p previous-window
bind C-p previous-window

# Detach session: Ctrl-a d
bind d detach

# Split panes: horizontal (|), vertical (-)
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Pane movement with vi keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Toggle last window: Ctrl-a Ctrl-a
bind C-a last-window

# Kill pane: Ctrl-a x
bind x kill-pane
bind k kill-pane
bind C-k kill-pane

# List all keybindings: Ctrl-a ?
bind ? list-keys

# List all windows: Ctrl-a w
bind w list-windows

# Send cursor to start of line
bind a send-prefix

# Catppiccin theme config
# # List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_flavor "cyberdream"

set -g @catppuccin-tmux_show_git 0
set -g @catppuccin-tmux_pane_id_style hide
set -g @catppuccin-tmux_zoom_id_style hide
set -g @catppuccin-tmux_show_path 1
set -g @catppuccin_window_text "\ #W"
set -g @catppuccin_window_default_text "\ #W"
set -g @catppuccin_window_current_text "\ #W"

# Status line
# set -g status-bg colour236
# set -g status-fg white
# set -g status-style bg=default
# set -g status-left ' #[align=left]#H '
# set -g status-right ' #[align=right]%Y-%m-%d %H:%M '
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g status-justify centre
set -g status-left ""
set -g status-right ""

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Sets background to transparent - has to be after TPM
set -g status-bg default
set -g status-style bg=default

# --- End of config ---
