[font]
size = 13.0

[window]
opacity = 0.85  # 1.0 = opaque, 0.0 = fully transparent

[font.normal]
family = "PragmataPro Nerd Font"
style = "Regular"

[font.bold]
family = "PragmataPro Nerd Font"
style = "Bold"

[font.italic]
family = "PragmataPro Nerd Font"
style = "Italic"

[font.bold_italic]
family = "PragmataPro Nerd Font"
style = "Bold Italic"
